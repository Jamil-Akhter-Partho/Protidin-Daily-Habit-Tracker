<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Protidin" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      ;(function () {
        try {
          var t = localStorage.getItem('protidin:theme') || 'system'
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var d = document.documentElement.dataset
          d.theme = t
          d.style = localStorage.getItem('protidin:style') || 'classic'
          d.bloom = localStorage.getItem('protidin:bloom') || 'pink'
        } catch (e) {}
      })()
    </script>
    <title>Protidin — Daily Habit Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
